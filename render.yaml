services:
  - type: web
    name: nexa-ai-chatbot
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "waitress-serve --host=0.0.0.0 --port=$PORT app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: FLASK_DEBUG
        value: "0"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
