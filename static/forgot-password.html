<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password — Nexa AI</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/auth.css">
</head>
<body>
  <main class="auth-split">
    <div class="auth-left">
      <h1>Reset Your Password</h1>
      <p>Enter your email and a new password to update your account.</p>
    </div>
    <div class="auth-right">
      <div class="auth-card">
        <h2>Forgot Password</h2>
        <form id="forgotPasswordForm">
          <div class="field"><input id="email" type="email" placeholder="Email address" required></div>
          <div class="field"><input id="password" type="password" placeholder="New password" required></div>
          <button type="submit" class="auth-btn auth-btn-primary" style="width:100%">Reset Password</button>
        </form>
        <div class="auth-footer" style="margin-top:14px"><a href="/login">Back to login</a></div>
      </div>
    </div>
  </main>

<script>
  document.getElementById('forgotPasswordForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const res = await fetch('/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();
    if (!res.ok) {
      alert(data.error || 'Password reset failed');
      return;
    }

    alert(data.message || 'Password updated successfully');
    window.location.href = '/login';
  });
</script>
</body>
</html>
