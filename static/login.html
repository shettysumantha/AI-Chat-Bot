<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — Nexa AI</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/auth.css">
</head>
<body>
  <main class="auth-split">
    <div class="auth-left">
      <h1>Welcome Back!</h1>
      <p>Sign in to continue chatting with Nexa AI. Secure • Fast • Modern</p>
      <div style="opacity:.9;margin-top:20px">
        <img src="/static/default-avatar.png" alt="illustration" style="max-width:360px;filter:brightness(.95)">
      </div>
    </div>
    <div class="auth-right">
      <div class="auth-card">
        <h2>Sign in to Nexa</h2>
        <form id="loginCard">
          <div class="field"><input id="email" type="email" placeholder="Email address" required></div>
          <div class="field"><input id="password" type="password" placeholder="Password" required></div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><label><input type="checkbox" id="remember"> Remember me</label><a href="/forgot-password">Forgot password?</a></div>
          <button type="submit" class="auth-btn auth-btn-primary" style="width:100%">Login</button>
        </form>
        <div style="text-align:center;margin:14px 0"><span style="color:var(--muted)">OR</span></div>
        <div class="auth-social">
          <button class="auth-btn auth-btn-outline" onclick="social('google')">Continue with Google</button>
          <button class="auth-btn auth-btn-outline" onclick="social('microsoft')">Continue with Microsoft</button>
          <button class="auth-btn auth-btn-outline" onclick="social('github')">Continue with GitHub</button>
        </div>
        <div class="auth-footer">Don't have an account? <a href="/register">Register</a></div>
      </div>
    </div>
  </main>

<script>
async function social(provider){
  alert('Social login ('+provider+') is not configured in this demo.');
}

document.getElementById('loginCard').addEventListener('submit', async function(e){
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const res = await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  const j = await res.json();
  if(j.error){ alert(j.error); } else { window.location.href = '/'; }
});
</script>
</body>
</html>
