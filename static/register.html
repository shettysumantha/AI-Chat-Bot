<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register — Nexa AI</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/auth.css">
</head>
<body>
  <main class="auth-split">
    <div class="auth-left">
      <h1>Create your Nexa account</h1>
      <p>Join Nexa AI to get instant answers, automate tasks, and boost productivity.</p>
    </div>
    <div class="auth-right">
      <div class="auth-card" id="regCard">
        <h2>Create account</h2>
        <div id="stepIndicator" style="margin-bottom:12px">Step <span id="stepNum">1</span> of 3</div>
        <form id="regForm">
          <div id="step1">
            <div class="field"><input id="email" type="email" placeholder="Email address" required></div>
            <div class="field"><input id="password" type="password" placeholder="Password" required></div>
            <div class="field"><input id="confirmPassword" type="password" placeholder="Confirm password" required></div>
            <div style="text-align:right"><button type="button" id="toStep2" class="auth-btn auth-btn-primary">Next</button></div>
          </div>

          <div id="step2" style="display:none">
            <div class="field"><input id="firstName" placeholder="First name" required></div>
            <div class="field"><input id="lastName" placeholder="Last name" required></div>
            <div class="field"><input id="phone" placeholder="Mobile number"></div>
            <div class="field"><select id="country"><option value="">Select country</option><option value="US">United States</option><option value="IN">India</option></select></div>
            <div class="field"><input id="company" placeholder="Company (optional)"></div>
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><input type="checkbox" id="terms"> <label for="terms">I agree to the Terms &amp; Conditions</label></div>
            <div style="display:flex;justify-content:space-between"><button type="button" id="backTo1" class="auth-btn auth-btn-outline">Back</button><button type="button" id="toStep3" class="auth-btn auth-btn-primary">Next</button></div>
          </div>

          <div id="step3" style="display:none">
            <div class="field"><input id="otpCode" placeholder="Optional OTP (leave blank to skip)"></div>
            <div style="display:flex;justify-content:flex-end;margin-top:8px"><button type="button" id="verifyOtp" class="auth-btn auth-btn-primary">Create account</button></div>
          </div>
        </form>
        <div class="auth-footer">Already have an account? <a href="/login">Login</a></div>
      </div>
    </div>
  </main>

<script>
function setStep(n){
  document.getElementById('stepNum').textContent = n;
  document.getElementById('step1').style.display = n===1? 'block':'none';
  document.getElementById('step2').style.display = n===2? 'block':'none';
  document.getElementById('step3').style.display = n===3? 'block':'none';
}

// validations
function validEmail(e){ return /\S+@\S+\.\S+/.test(e); }

document.getElementById('toStep2').addEventListener('click', ()=>{
  const email = document.getElementById('email').value.trim();
  const pw = document.getElementById('password').value;
  const cpw = document.getElementById('confirmPassword').value;
  if(!validEmail(email)){ alert('Invalid email'); return; }
  if(pw.length < 8){ alert('Password too short (min 8)'); return; }
  if(pw !== cpw){ alert('Passwords do not match'); return; }
  setStep(2);
});

document.getElementById('backTo1').addEventListener('click', ()=> setStep(1));

document.getElementById('toStep3').addEventListener('click', ()=>{
  const fn = document.getElementById('firstName').value.trim();
  const ln = document.getElementById('lastName').value.trim();
  const terms = document.getElementById('terms').checked;
  if(!fn || !ln){ alert('Please enter your name'); return; }
  if(!terms){ alert('You must accept Terms & Conditions'); return; }
  setStep(3);
});

document.getElementById('verifyOtp').addEventListener('click', async ()=>{
  const payload = {
    name: (document.getElementById('firstName').value.trim() + ' ' + document.getElementById('lastName').value.trim()),
    email: document.getElementById('email').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    password: document.getElementById('password').value
  };
  const res = await fetch('/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const out = await res.json();
  if(out.error){ alert(out.error); } else { alert('Account created successfully'); window.location.href = '/login'; }
});

setStep(1);
</script>
</body>
</html>
